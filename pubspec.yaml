name: um_ar_mobile_app
description: "UM-AR Nav - University of Mindanao Matina Campus navigation app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  flutter_bloc: ^9.1.1
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  flutter_map: ^8.3.1
  flutter_map_cache: ^2.1.0
  latlong2: ^0.10.1
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  collection: ^1.18.0
  intl: ^0.19.0
  dio: ^5.4.0
  dio_cache_interceptor: ^4.0.3
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.3.0
  flutter_compass: ^0.8.0
  google_sign_in: ^6.2.1
  camera: ^0.10.5+9
  sensors_plus: ^7.0.0
  image_picker: ^1.0.7
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
